packages:
  - packages/*
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lefthook: true
  lightningcss: true
minimumReleaseAgeExclude:
  - ixia-ui-react@1.0.0 || 1.0.1 || 1.0.2 || 2.2.3 || 2.6.0
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vitest: 5.1.0
  vite-plus: 1.7.0
  '@vitest/browser-playwright': 5.1.0
overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vitest
  allowedVersions:
    vitest: '*'
